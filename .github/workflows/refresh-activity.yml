name: Refresh activity cache

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-activity.yml"
  schedule:
    # 07:47 Asia/Kolkata; scheduled workflows use UTC.
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: activity-cache
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch and normalize activity
        run: node scripts/update-activity-cache.mjs

      - name: Commit refreshed cache
        run: |
          if git diff --quiet -- data/activity.json; then
            echo "Activity cache is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/activity.json
          git commit -m "chore: refresh activity cache"
          git push
